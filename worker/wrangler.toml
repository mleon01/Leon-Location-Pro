# Configuration du Cloudflare Worker (API du site).
# Les SECRETS (identifiant et clé API Odoo) ne sont PAS ici :
#   - en local  : fichier worker/.dev.vars (ignoré par Git, modèle : .dev.vars.example)
#   - en ligne  : npx wrangler secret put ODOO_LOGIN / ODOO_API_KEY / SIGNING_SECRET
name = "leon-location-pro-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ODOO_URL = "https://leon-location-pro.odoo.com"
ODOO_DB = "leon-location-pro"
WEBSITE_ID = "1"
# Catégorie e-commerce des véhicules affichés dans « Notre flotte » sur l'accueil
FEATURED_CATEGORY_ID = "1"
# Fuseau de La Réunion (UTC+4, pas d'heure d'été)
TZ_OFFSET_HOURS = "4"
# Sites autorisés à appeler l'API (séparés par des virgules)
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,https://mleon01.github.io,https://leon-location-pro.leon-location-pro.workers.dev"

# Paiement : "simulation" tant que Stripe et Alma ne sont pas configurés
PAYMENT_MODE = "simulation"
# Adresse publique du site (liens envoyés dans les e-mails)
SITE_URL = "https://leon-location-pro.leon-location-pro.workers.dev"

# Anti-abus : 20 envois (commandes, documents) par minute et par adresse IP
[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Déploiement automatique sur GitHub Pages à chaque push sur main.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          # Le site est servi depuis https://<compte>.github.io/<nom-du-dépôt>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DATA_SOURCE: mock

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
